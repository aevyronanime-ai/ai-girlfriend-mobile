<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f071e"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="gfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ff2a85" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="10 15"/>
  <circle cx="256" cy="256" r="155" fill="none" stroke="url(#gfGradient)" stroke-width="8" filter="url(#glow)"/>

  <!-- Glowing Heart Core -->
  <g filter="url(#glow)">
    <path d="M256 165 C220 115, 130 120, 130 200 C130 260, 210 320, 256 360 C302 320, 382 260, 382 200 C382 120, 292 115, 256 165 Z" fill="url(#gfGradient)" fill-opacity="0.85" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="230" r="18" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Title Monogram -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ff2a85" letter-spacing="4" text-anchor="middle" filter="url(#glow)">AI GIRLFRIEND</text>
</svg>
