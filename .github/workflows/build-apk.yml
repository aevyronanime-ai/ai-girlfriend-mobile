name: Build AI Girlfriend Mobile Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.jks \
            -alias aigirlfriend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass girlfriend123 \
            -keypass girlfriend123 \
            -dname "CN=AI Girlfriend Mobile, OU=Companion, O=AIGirlfriend, L=NewDelhi, S=DL, C=IN"

      - name: Build Debug & Signed Release APKs
        run: |
          cd android
          gradle assembleDebug assembleRelease --stacktrace

      - name: Verify Generated APK Files
        run: |
          echo "Listing generated APKs:"
          find android/app/build/outputs/apk/ -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Girlfriend-Mobile-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Girlfriend-Mobile-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
