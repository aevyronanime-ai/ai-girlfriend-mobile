<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="10 15"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#cyanPurple)" stroke-width="8" filter="url(#glow)"/>

  <!-- Arc Reactor Segments -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="110" fill="none" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.8" stroke-dasharray="25 15"/>
    <circle cx="256" cy="256" r="75" fill="none" stroke="#ff0080" stroke-width="5" stroke-dasharray="40 20"/>
    <!-- Core -->
    <circle cx="256" cy="256" r="45" fill="#00f0ff" fill-opacity="0.9"/>
    <circle cx="256" cy="256" r="25" fill="#ffffff"/>
  </g>

  <!-- Center Text / Monogram -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#00f0ff" letter-spacing="8" text-anchor="middle" filter="url(#glow)">J.A.R.V.I.S.</text>
</svg>
